<!doctype html>
<!-- The one accent colour: data-accent="red" (PERMIAS deep red) or "navy" (deep ink-blue). -->
<html lang="id" data-accent="red">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <title>PERMIAS Nasional | Indonesia</title>
    <script>
      // Apply saved theme before paint so dark mode never flashes light.
      try {
        if (JSON.parse(localStorage.getItem('permias_theme')) === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
