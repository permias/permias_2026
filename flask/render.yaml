# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → connect permias/permias_2026
services:
  - type: web
    name: permias-api
    runtime: python
    rootDir: flask
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT -w 2 "app:app"
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_FALLBACKS
        value: gemini-2.0-flash,gemini-2.0-flash-lite
      - key: CORS_ORIGINS
        value: https://permiasnasional.com
      - key: TRUST_X_FORWARDED_FOR
        value: "1"
      - key: FLASK_DEBUG
        value: "false"
      - key: CHAPTER_REGISTER_TO
        value: info@permiasnasional.com
      - key: CONTACT_TO
        value: info@permiasnasional.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MAIL_FROM
        sync: false
