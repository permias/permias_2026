name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          # Lockfile was generated on macOS; install Linux Rolldown binding for Vite 8 on ubuntu-latest.
          npm install --no-save --workspace=permias-nasional @rolldown/binding-linux-x64-gnu@1.0.0-rc.15

      - name: Build site
        run: npm run build
        env:
          VITE_SITE_URL: https://permiasnasional.com

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: permias-nasional/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
